<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Správa personálu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='index.css') }}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-crosshairs">SPARTANS</i>
      </div>

      <div class="sidebar-category">Uživatel</div>
      <div class="sidebar-nav">
        <a href="/" class="active"
          ><i class="fa-solid fa-desktop"></i> Seznam členů</a
        >

        <a href="/omluvenky"
          ><i class="fa-regular fa-calendar-check"></i> Omluvenky</a
        >
      </div>

      <div class="sidebar-category">Akce</div>
      <div class="sidebar-nav">
        <a href="/akce"><i class="fa-solid fa-map-location-dot"></i> Akce </a>
        <a href="/strike"><i class="fa-solid fa-triangle-exclamation"></i> STRIKE evidence</a>
      </div>

      <div class="sidebar-category">Velení</div>
        <div class="sidebar-nav">
            <a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Přehled (HQ)</a>
        </div>
      <div style="margin-top: auto; padding-top: 20px;">
            <a href="/logout" style="color: #d32f2f; border-top: 1px solid #2a2a2a; margin-top: 20px;"><i class="fa-solid fa-power-off"></i> Odhlásit velitele</a>
        </div>
    </div>

    <div class="main-content">
      <div class="container" style="display: block">
       
        <h1>Dashboard Letky</h1>

        <div class="form-box">
          <h2>PŘIDAT ČLENA</h2>
          <form action="/pridat" method="POST" class="form-group">
            <label for="jmeno">Jméno</label>
            <input
              type="text"
              id="jmeno"
              name="jmeno"
              placeholder="např. Tom Hanks"
              required
            />

            <label for="hodnost">Hodnost:</label>
            <select id="hodnost" name="hodnost">
              {% for h in hodnosti %}
              <option value="{{ h.id }}">{{ h.nazev }}</option>
              {% endfor %}
            </select>

            <button type="submit">Zapsat nového člena</button>
          </form>
        </div>

        <h2>Aktivní personál</h2>
        <div style="margin-bottom: 20px; position: relative;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; top: 12px; color: #888;"></i>
                <input type="text" id="search-input" onkeyup="hledatClena()" placeholder="Hledat jméno nebo Callsign..." style="width: 100%; padding: 10px 10px 10px 40px; background-color: #1a1a1a; border: 1px solid #333; color: #fff; font-family: 'Roboto', sans-serif; box-sizing: border-box; border-radius: 4px;">
            </div>
        <table id="tabulka-clenu">
          <tr>
            <th>ID</th>
            <th>Jméno</th>
            <th>Hodnost</th>
            <th>Složka / smazat profil</th>
          </tr>
          {% for clen in clenove %}
          <tr>
            <td class="cell-id">#{{ clen.id }}</td>
            <td class="cell-name">{{ clen.jmeno }}</td>
            <td class="cell-rank">{{ clen.hodnost.nazev }}</td>
            <td>
              <div style="display: flex; gap: 10px">
                <a href="/profil/{{ clen.id }}"
                  ><button class="action-btn">Otevřít profil</button></a
                >
                <form
                  action="/smazat_clena/{{ clen.id }}"
                  method="POST"
                  onsubmit="return confirm('Opravdu smazat?');"
                >
                  <button type="submit" class="delete-btn">Smazat</button>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </div>

    <script>
        function hledatClena() {
            // Získání hodnoty z vyhledávacího pole a převod na malá písmena
            var input = document.getElementById("search-input");
            var filter = input.value.toLowerCase();
            var table = document.getElementById("tabulka-clenu");
            var tr = table.getElementsByTagName("tr");

            // Procházení všech řádků tabulky (začínáme od 1, abychom přeskočili hlavičku s názvy sloupců)
            for (var i = 1; i < tr.length; i++) {
                // Bereme sloupec s indexem 1 (kde je jméno/callsign). Pokud chceš hledat podle ID, byl by to index 0
                var td = tr[i].getElementsByTagName("td")[1]; 
                
                if (td) {
                    var txtValue = td.textContent || td.innerText;
                    // Pokud text ve sloupci obsahuje to, co jsme napsali (shoda)
                    if (txtValue.toLowerCase().indexOf(filter) > -1) {
                        tr[i].style.display = ""; // Zobrazí řádek
                    } else {
                        tr[i].style.display = "none"; // Skryje řádek
                    }
                }
            }
        }
    </script>
  </body>
</html>
