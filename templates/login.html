<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PŘÍSTUP - SPEAR System</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    
</head>
<body>

    <div class="login-box">
        <i class="fa-solid fa-shield-halved icon"></i>
        <h1>SPEAR <span>SYSTEM</span></h1>
        <p style="color: #888; margin-bottom: 30px; font-size: 0.9rem;">Zadejte velitelský ověřovací kód pro přístup do databáze letky.</p>
        
        {% if chyba %}
            <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ chyba }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <input type="password" name="heslo" placeholder="••••••••" required autocomplete="off" autofocus>
            <button type="submit">Autorizovat přístup</button>
        </form>
    </div>

</body>
</html>
